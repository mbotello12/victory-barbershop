
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | Victory Barbershop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: #08090c;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .thank-you {
      max-width: 650px;
    }

    .eyebrow {
      color: #d6a84b;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.2em;
    }

    h1 {
      margin-top: 22px;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      font-weight: 900;
    }

    h1 span {
      display: block;
      color: #d6a84b;
    }

    p {
      margin-top: 22px;
      color: #d5d5d2;
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 32px;
      padding: 15px 25px;
      background: #d6a84b;
      color: #08090c;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      background: transparent;
      outline: 1px solid #d6a84b;
      color: #d6a84b;
    }
  </style>
</head>

<body>
  <main class="thank-you">
    <span class="eyebrow">VICTORY BARBERSHOP · VICTORIA, TEXAS</span>

    <h1>
      THANK YOU.
      <span>WE'LL BE IN TOUCH.</span>
    </h1>

    <p>
      We appreciate your interest in becoming part of Victory.
      Your inquiry has been received, and we look forward
      to learning more about you.
    </p>

    <a href="/">BACK TO VICTORY</a>
  </main>
</body>
</html>
